[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "banking-agent-backend"
version = "0.1.0"
description = "Deterministic mock banking core for an AI banking agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langchain-core>=1.2,<2",
  "langgraph==1.2.17",
  "langgraph-checkpoint-postgres==3.2.0",
  "python-multipart>=0.0.9,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<2.4",
  "seaborn>=0.13,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["banking_core", "agent_tools", "agent", "agent_persistence", "banking_dataset", "shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "postgres: requires a real PostgreSQL database",
  "live_provider: consumes an explicitly configured external model provider",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
packages = ["banking_core", "agent_tools", "agent", "agent_persistence", "banking_dataset", "shared"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "matplotlib",
  "matplotlib.*",
  "numpy",
  "numpy.*",
  "pandas",
  "pandas.*",
  "seaborn",
  "seaborn.*",
]
follow_imports = "skip"
ignore_errors = true
