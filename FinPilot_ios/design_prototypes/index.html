<main class="stage"><aside class="brief"><h1>对话先行，功能随场景展开。</h1><p>A 方案第二版。导航逻辑来自原有产品结构，视觉语言来自你指定的 6 张美学参考图。</p><div class="map"><div class="map-row"><strong>总览</strong><span>助手 · 分析 · 日历</span></div><div class="map-row"><strong>转账</strong><span>独立页面，无二级栏</span></div><div class="map-row"><strong>账本</strong><span>预算 · 订阅 · 储蓄罐</span></div><div class="map-row"><strong>资产</strong><span>账户（含银行卡）· 理财</span></div></div></aside>

const nav={overview:['助手','分析','日历'],transfer:[],ledger:['预算','订阅','储蓄罐'],assets:['账户','理财']},labels={overview:'FinPilot',transfer:'转账',ledger:'账本',assets:'资产'},state={primary:'overview',secondary:{overview:'助手',ledger:'预算',assets:'账户'}};const $=s=>document.querySelector(s),E={secondary:$('#secondary'),viewport:$('#viewport'),title:$('#headerTitle'),sheet:$('#sheet'),toast:$('#toast'),voice:$('#voiceLayer')},icon=n=>`<svg><use href="#${n}"/></svg>`;
function renderNav(){E.title.textContent=labels[state.primary];E.secondary.innerHTML=nav[state.primary].map(x=>`<button class="${state.secondary[state.primary]===x?'active':''}" data-secondary="${x}">${x}</button>`).join('');document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.primary===state.primary));E.secondary.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.secondary[state.primary]=b.dataset.secondary;render()})}
function assistant(){return `<section class="page assistant-page"><div class="greeting"><h1>早上好，泽希。</h1><p>过去 7 天，你在咖啡店消费了 4 次，共 ¥86。比上周少了 ¥32。</p></div><div class="signal-note"><span class="signal-mark">${icon('bell')}</span><div><strong>下周有一笔订阅续费</strong><span>视频会员将在 11 月 2 日扣款 ¥25，价格比上月高 ¥5。</span></div></div><div class="assistant-space"></div><div class="reply" id="reply">已准备好记录。确认后会写入账本，并保留撤销入口。</div><div class="quick-prompts"><button class="tag" data-prompt="记一笔 28 元咖啡">记一笔消费</button><button class="tag" data-prompt="这个月还能花多少？">还能花多少</button><button class="tag" data-prompt="检查最近的订阅">检查订阅</button></div><div class="composer-wrap"><div class="composer"><input id="ask" placeholder="问我任何财务问题"><button class="voice" id="voiceButton" aria-label="语音输入">${icon('mic')}</button></div></div></section>`}
function analysis(){return `<section class="page"><div class="metric"><span class="metric-label">10 月总支出</span><strong>¥3,842.60</strong><small>比上月少 8.4%</small><div class="bars">${[45,62,54,78,43,67,82].map((v,i)=>`<div class="bar"><i style="height:${v}%"></i><span>${'一二三四五六日'[i]}</span></div>`).join('')}</div></div><div class="insight"><strong>本周最明显的变化</strong><p>通勤支出下降 ¥96，餐饮支出上升 ¥54。整体仍在预算范围内。</p></div>${financeList('分类明细')}</section>`}
function financeList(title){return `<div class="section"><div class="row-head"><h3>${title}</h3><button>查看全部</button></div><div class="list"><div class="list-row"><span class="list-icon peach">${icon('target')}</span><span class="list-copy"><strong>餐饮</strong><span>12 笔</span></span><span class="list-value">¥864<small>22.5%</small></span></div><div class="list-row"><span class="list-icon mint">${icon('swap')}</span><span class="list-copy"><strong>交通</strong><span>18 笔</span></span><span class="list-value">¥428<small>11.1%</small></span></div></div></div>`}
function calendar(){let days=Array.from({length:35},(_,i)=>i<2?'':i-1);return `<section class="page"><div class="calendar-head"><h2>2026年10月</h2><span>支出热力</span></div><div class="weekdays">${'一二三四五六日'.split('').map(x=>`<span>${x}</span>`).join('')}</div><div class="calendar-grid">${days.map((d,i)=>`<div class="day ${i%11===0?'hot':i%5===0?'m3':i%3===0?'m2':''}">${d}<i></i></div>`).join('')}</div><div class="calendar-legend"><span>少</span><i style="background:#e6f5ec"></i><i style="background:#c4ebd5"></i><i style="background:#78d3a1"></i><i style="background:#ffc2a1"></i><span>多</span></div><div class="cal-note">10 月 24 日支出最高：旅行预订 ¥1,280。点击日期可查看当天账单。</div></section>`}
function transfer(){return `<section class="page"><div class="transfer-hero"><h1>转账</h1><p>安全、快速地完成付款和收款</p></div><div class="transfer-actions">${[['scan','扫码'],['person','联系人'],['bank','银行卡'],['swap','AA 收款']].map(x=>`<button data-sheet><span class="action-icon">${icon(x[0])}</span>${x[1]}</button>`).join('')}</div><div class="section"><div class="row-head"><h3>最近联系人</h3><button>全部</button></div></div><div class="people"><div class="person"><span class="avatar">林</span>林然</div><div class="person"><span class="avatar">陈</span>陈墨</div><div class="person"><span class="avatar">周</span>周末</div><div class="person"><span class="avatar">家</span>家庭账户</div></div><button class="primary new-transfer" data-sheet>新建转账</button><div class="section"><div class="row-head"><h3>最近记录</h3></div><div class="list"><div class="list-row"><span class="list-icon mint">${icon('person')}</span><span class="list-copy"><strong>林然</strong><span>今天 08:42 · 已完成</span></span><span class="list-value">-¥120</span></div><div class="list-row"><span class="list-icon violet">${icon('bank')}</span><span class="list-copy"><strong>房租账户</strong><span>10月28日 · 已完成</span></span><span class="list-value">-¥3,200</span></div></div></div></section>`}
function budget(){return `<section class="page"><div class="budget-total"><span>10 月可用预算</span><strong>¥2,460</strong><div class="progress"><i></i></div><div class="budget-meta"><span>已用 ¥5,240</span><span>68%</span></div></div>${financeList('分类预算')}</section>`}
function subscriptions(){return `<section class="page"><div class="subscription-summary"><div><span>每月订阅</span><strong>¥98</strong></div><span>6 项活跃</span></div><div class="section"><div class="list"><div class="list-row"><span class="list-icon peach">V+</span><span class="list-copy"><strong>视频会员</strong><span>11月2日续费</span></span><span class="list-value">¥25<small>价格上涨</small></span></div><div class="list-row"><span class="list-icon mint">M</span><span class="list-copy"><strong>音乐会员</strong><span>11月8日续费</span></span><span class="list-value">¥15</span></div><div class="list-row"><span class="list-icon violet">云</span><span class="list-copy"><strong>云存储</strong><span>11月15日续费</span></span><span class="list-value">¥21</span></div></div></div></section>`}
function pots(){return `<section class="page"><div class="pot-grid"><div class="pot">${icon('target')}<strong>旅行基金</strong><span>¥6,800 / ¥10,000</span></div><div class="pot">${icon('wallet')}<strong>新电脑</strong><span>¥3,200 / ¥8,000</span></div><div class="pot">${icon('bank')}<strong>应急储备</strong><span>已存 3.5 个月</span></div><div class="pot">${icon('chart')}<strong>创建储蓄罐</strong><span>设定一个新目标</span></div></div></section>`}
function accounts(){return `<section class="page"><div class="assets-total"><span>净资产</span><strong>¥45,020.80</strong><small>4 个账户 · 刚刚同步</small></div><div class="account-card"><div class="account-top"><span class="bank-mark">招</span><div class="list-copy" style="margin-left:11px"><strong>招商银行</strong><span>储蓄卡 · 2868</span></div><span>›</span></div><p>¥8,420.80</p></div><div class="credit-card"><span class="visa">VISA</span><i class="chip"></i><span class="number">•••• 2026</span></div><div class="section" style="padding-top:0"><button class="primary" style="width:100%">管理银行卡</button></div></section>`}
function investments(){return `<section class="page"><div class="investment"><span class="metric-label">理财总资产</span><h2>¥24,600.00</h2><small style="color:#20a073">今年收益 +¥860.40</small><div class="allocation"><i></i><i></i><i></i></div><div class="allocation-labels"><span>稳健 55%</span><span>指数 28%</span><span>现金 17%</span></div><div class="row-head"><h3>持有产品</h3><button>全部</button></div><div class="list"><div class="list-row"><span class="list-icon mint">${icon('chart')}</span><span class="list-copy"><strong>稳健组合</strong><span>低风险</span></span><span class="list-value">¥13,530<small>+2.8%</small></span></div><div class="list-row"><span class="list-icon">${icon('chart')}</span><span class="list-copy"><strong>宽基指数</strong><span>中风险</span></span><span class="list-value">¥6,888<small>+5.1%</small></span></div></div></div></section>`}
function render(){renderNav();let key=state.primary==='overview'?state.secondary.overview:state.primary==='ledger'?state.secondary.ledger:state.primary==='assets'?state.secondary.assets:'转账',fn={助手:assistant,分析:analysis,日历:calendar,转账:transfer,预算:budget,订阅:subscriptions,储蓄罐:pots,账户:accounts,理财:investments}[key];E.viewport.innerHTML=fn();bind()}
function bind(){document.querySelectorAll('[data-sheet]').forEach(b=>b.onclick=()=>E.sheet.classList.add('open'));document.querySelectorAll('.sheet-options button').forEach(b=>b.onclick=()=>{E.sheet.classList.remove('open');showToast(`已选择${b.textContent}`)});$('#voiceButton')?.addEventListener('click',()=>E.voice.classList.add('open'));$('#voiceClose').onclick=()=>{E.voice.classList.remove('open');let input=$('#ask'),reply=$('#reply');if(input){input.value='午饭 36 元，记在餐饮';reply.classList.add('show')}};document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{$('#ask').value=b.dataset.prompt;$('#reply').classList.add('show')})}
function showToast(t){E.toast.textContent=t;E.toast.classList.add('show');setTimeout(()=>E.toast.classList.remove('show'),1400)}document.querySelectorAll('#tabbar button').forEach(b=>b.onclick=()=>{state.primary=b.dataset.primary;render()});render();
</script></body></html>
