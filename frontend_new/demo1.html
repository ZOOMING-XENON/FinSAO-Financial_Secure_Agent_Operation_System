<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FinSAO – Secure Agent Prototype</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6f9;--card:#fff;--ink:#0f1b2d;--mut:#64748b;--line:#e2e8f0;--brand:#1d4ed8;--brand2:#0ea5e9;
--g:#16a34a;--gb:#dcfce7;--y:#b45309;--yb:#fef3c7;--r:#b91c1c;--rb:#fee2e2;--bot:#eef2ff;--user:#1d4ed8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c2e;--ink:#e8eefc;--mut:#94a3b8;--line:#23304a;--brand:#60a5fa;--brand2:#38bdf8;--gb:#0f2e1c;--yb:#33260b;--rb:#3a1515;--g:#4ade80;--y:#fbbf24;--r:#f87171;--bot:#1a2542;--user:#2563eb}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#131c2e;--ink:#e8eefc;--mut:#94a3b8;--line:#23304a;--brand:#60a5fa;--brand2:#38bdf8;--gb:#0f2e1c;--yb:#33260b;--rb:#3a1515;--g:#4ade80;--y:#fbbf24;--r:#f87171;--bot:#1a2542;--user:#2563eb}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:var(--bg)}
header{padding:14px 16px;background:linear-gradient(135deg,#1e3a8a,#0ea5e9);color:#fff;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:#ffffff26;display:grid;place-items:center;font-weight:800}
header h1{font-size:16px;margin:0}header small{opacity:.85;font-size:12px}
header button{margin-left:auto;background:#ffffff26;border:0;color:#fff;border-radius:10px;padding:7px 10px;font-size:12px;cursor:pointer}
.tiers{display:flex;gap:6px;padding:10px 12px 0}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px}
.G{background:var(--gb);color:var(--g)}.Y{background:var(--yb);color:var(--y)}.R{background:var(--rb);color:var(--r)}
#feed{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:10px 13px;border-radius:16px;animation:in .25s}
.bot{background:var(--bot);border-bottom-left-radius:4px;align-self:flex-start}
.me{background:var(--user);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;align-self:stretch;animation:in .25s}
.card h3{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-of-type{border:0}.row span:first-child{color:var(--mut)}
.big{font-size:26px;font-weight:700;margin:2px 0 8px}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border:0;border-radius:12px;padding:11px;font-weight:600;font-size:14px;cursor:pointer;background:var(--brand);color:#fff}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--r);color:#fff}.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 13px;font-size:13px;cursor:pointer}
.chip i{font-style:normal;margin-right:5px}
form{display:flex;gap:8px;padding:6px 12px 12px}
form input{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px;font-size:15px}
form button{border:0;background:var(--brand);color:#fff;border-radius:14px;padding:0 16px;font-weight:700}
.otp{display:flex;gap:8px;justify-content:center;margin:10px 0}
.otp input{width:40px;height:48px;text-align:center;font-size:20px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.otp input:focus{outline:2px solid var(--brand)}
.err{color:var(--r);font-size:13px;text-align:center;min-height:18px}
.ok{display:flex;gap:10px;align-items:center}.tick{width:34px;height:34px;border-radius:50%;background:var(--gb);color:var(--g);display:grid;place-items:center;font-weight:800}
.lock{background:var(--rb);color:var(--r);text-align:center;padding:12px;border-radius:12px;font-weight:600}
#audit{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:5}
#audit.on{display:flex}
#audit .sheet{background:var(--card);width:100%;max-width:430px;max-height:70%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.ev{font:12px/1.5 ui-monospace,Menlo,monospace;border-bottom:1px solid var(--line);padding:6px 0;color:var(--mut)}.ev b{color:var(--ink)}
.note{font-size:12px;color:var(--mut);margin-top:8px}
</style></head><body>
<div class="app">
<header><div class="logo">F</div><div><h1>FinSAO Assistant</h1><small>Secure agent · Lin Zhang (demo)</small></div><button id="ab">Audit trail</button></header>
<div class="tiers"><span class="pill G">● Green · read</span><span class="pill Y">● Yellow · confirm</span><span class="pill R">● Red · MFA</span></div>
<div id="feed"></div>
<div class="chips" id="chips"></div>
<form id="f"><input id="in" placeholder="Ask FinSAO…" autocomplete="off"><button>Send</button></form>
</div>
<div id="audit"><div class="sheet"><h3 style="margin:0 0 8px">Audit trail</h3><div id="ev"></div><button class="btn sec" style="width:100%;margin-top:12px" id="ac">Close</button></div></div>
<script>
var S={bal:12480.50,spent:0,fails:0,locked:false,card:'Active'};
var $=function(i){return document.getElementById(i)},feed=$('feed');
function fmt(n){return '¥'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function tid(){return 'tr-'+Math.random().toString(16).slice(2,8)}
function log(t,a){var d=document.createElement('div');d.className='ev';d.innerHTML='<b>'+t+'</b> · '+a+' · '+tid();$('ev').prepend(d)}
function add(h,c){var d=document.createElement('div');d.className=c;d.innerHTML=h;feed.appendChild(d);feed.scrollTop=feed.scrollHeight;return d}
function say(t){return add(t,'m bot')}
function tier(t){var n={G:'Green · read-only',Y:'Yellow · confirmation',R:'Red · MFA required'};return '<span class="pill '+t+'">● '+n[t]+'</span>'}
var chips=[['💰','Check balance'],['↗','Transfer ¥500 to Mom'],['↗','Transfer ¥600 to Mom'],['🔁','Show subscriptions'],['🧊','Freeze my card'],['🚨','Report card lost']];
chips.forEach(function(c){var b=document.createElement('button');b.className='chip';b.innerHTML='<i>'+c[0]+'</i>'+c[1];b.onclick=function(){send(c[1])};$('chips').appendChild(b)});
function send(t){if(!t.trim())return;add(t,'m me');setTimeout(function(){route(t.toLowerCase())},350)}
function route(q){
 var m=q.match(/(\d[\d,]*)/);
 if(q.indexOf('balance')>-1){log('READ','get_balances');
  add('<h3>Balances '+tier('G')+'</h3><div class="big">'+fmt(S.bal)+'</div><div class="row"><span>Checking ••4821</span><span>'+fmt(S.bal-3000)+'</span></div><div class="row"><span>Savings ••7730</span><span>'+fmt(3000)+'</span></div>','card');say('Here\u2019s your current position. Anything else?')}
 else if(q.indexOf('transfer')>-1&&m){draft(parseFloat(m[1].replace(/,/g,'')))}
 else if(q.indexOf('subscri')>-1){log('READ','list_subscriptions');
  add('<h3>Subscriptions '+tier('G')+'</h3><div class="row"><span>StreamPlus</span><span>¥45.00/mo</span></div><div class="row"><span>CloudDrive</span><span>¥21.00/mo</span></div><div class="row"><span>FitClub</span><span>¥199.00/mo</span></div><div class="note">Cancelling any of these needs your confirmation.</div>','card')}
 else if(q.indexOf('freeze')>-1){log('REQUEST','freeze_card');S.card='Frozen';
  var c=add('<h3>Freeze card ••1093 '+tier('Y')+'</h3><div class="row"><span>Action</span><span>Freeze (reversible)</span></div><div class="btns"><button class="btn sec">Cancel</button><button class="btn">Confirm</button></div>','card');
  c.querySelector('.btn:not(.sec)').onclick=function(){lockBtns(c);log('COMMIT','freeze_card');say('✅ Card ••1093 is frozen. You can unfreeze it any time.')};
  c.querySelector('.sec').onclick=function(){lockBtns(c);say('Okay, nothing changed.')}}
 else if(q.indexOf('lost')>-1){mfaFlow({title:'Report card lost',rows:[['Card','••1093'],['Effect','Card permanently blocked, replacement issued']],op:'report_card_lost',done:'🚨 Card ••1093 is reported lost and blocked. A replacement is on the way.'})}
 else say('I can check balances, move money, review subscriptions and manage your cards. Try one of the shortcuts below.')}
function lockBtns(c){c.querySelectorAll('button').forEach(function(b){b.disabled=true})}
function draft(a){
 if(a<=0){say('Please enter an amount above zero.');return}
 if(a>S.bal){say('That\u2019s more than your available balance of '+fmt(S.bal)+'.');return}
 var cum=S.spent+a,red=cum>1000;log('DRAFT','transfer '+fmt(a)+' · daily total '+fmt(cum));
 var rows=[['To','Mom · ••3315'],['Amount',fmt(a)],['From','Checking ••4821'],['Today\u2019s outgoing',fmt(cum)+' / ¥1,000']];
 if(red){say('This brings today\u2019s outgoing transfers to '+fmt(cum)+', above the ¥1,000 daily limit, so I need to verify it\u2019s you.');
  mfaFlow({title:'Transfer '+fmt(a),rows:rows,op:'commit_transfer',done:'✅ '+fmt(a)+' sent to Mom.',amt:a})}
 else{var c=add('<h3>Confirm transfer '+tier('Y')+'</h3>'+rows.map(r2).join('')+'<div class="btns"><button class="btn sec">Cancel</button><button class="btn">Confirm</button></div>','card');
  c.querySelector('.btn:not(.sec)').onclick=function(){lockBtns(c);commit(a,'commit_transfer')};
  c.querySelector('.sec').onclick=function(){lockBtns(c);log('CANCEL','transfer draft');say('Transfer cancelled. No money moved.')}}}
function r2(r){return '<div class="row"><span>'+r[0]+'</span><span>'+r[1]+'</span></div>'}
function commit(a,op){S.bal-=a;S.spent+=a;log('COMMIT',op+' · ledger balanced');
 add('<div class="ok"><div class="tick">✓</div><div><b>'+fmt(a)+' sent to Mom</b><div class="note" style="margin:0">New balance '+fmt(S.bal)+'</div></div></div>','card')}
function mfaFlow(o){
 var c=add('<h3>'+o.title+' '+tier('R')+'</h3>'+o.rows.map(r2).join('')+'<div class="note" style="margin-top:10px">Enter the 6-digit code from your device. Demo code: <b>123456</b></div><div class="otp">'+[0,1,2,3,4,5].map(function(){return '<input inputmode="numeric" maxlength="1">'}).join('')+'</div><div class="err"></div><div class="btns"><button class="btn sec">Cancel</button><button class="btn red">Verify &amp; approve</button></div>','card');
 var ins=c.querySelectorAll('.otp input'),err=c.querySelector('.err');
 ins.forEach(function(i,k){i.oninput=function(){if(i.value&&ins[k+1])ins[k+1].focus()};i.onkeydown=function(e){if(e.key==='Backspace'&&!i.value&&ins[k-1])ins[k-1].focus()}});
 c.querySelector('.sec').onclick=function(){lockBtns(c);log('CANCEL',o.op);say('Cancelled. Nothing was changed.')};
 c.querySelector('.red').onclick=function(){
  if(S.locked)return;var code=Array.prototype.map.call(ins,function(i){return i.value}).join('');
  if(code==='123456'){S.fails=0;lockBtns(c);log('MFA_OK',o.op);if(o.amt)commit(o.amt,o.op);else{log('COMMIT',o.op);say(o.done)}}
  else{S.fails++;log('MFA_FAIL','attempt '+S.fails+'/3');
   if(S.fails>=3){S.locked=true;lockBtns(c);c.insertAdjacentHTML('beforeend','<div class="lock" style="margin-top:10px">🔒 Safety lock · too many attempts. Try again in 15 minutes.</div>');log('SAFETY_LOCK','timed lock created')}
   else err.textContent='Incorrect code · '+(3-S.fails)+' attempt'+(3-S.fails>1?'s':'')+' left'}}}
$('f').onsubmit=function(e){e.preventDefault();var v=$('in').value;$('in').value='';send(v)};
$('ab').onclick=function(){$('audit').classList.add('on')};$('ac').onclick=function(){$('audit').classList.remove('on')};
say('Hi Lin 👋 I\u2019m your FinSAO assistant. Reading data is instant, small payments need your confirmation, and anything high-risk needs MFA.');
log('SESSION','started');
</script></body></html>
