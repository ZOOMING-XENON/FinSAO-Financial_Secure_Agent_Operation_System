<style>

h2{margin:0 0 16px;font-size:30px;font-weight:800;letter-spacing:-.03em}h3{margin:0 0 12px;font-size:17px;font-weight:700}
.hero{padding:20px 0 28px}.hero h1{font-size:clamp(34px,6vw,62px);line-height:1.05;letter-spacing:-.04em;font-weight:800;margin:10px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-bottom:14px}.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}

async function api(method,path,o={}){
 const q=o.query?'?'+new URLSearchParams(Object.entries(o.query).filter(([,v])=>v!==''&&v!=null)):'';
 const h={Accept:'application/json','Accept-Language':LANG==='en'?'en':'zh-CN','X-Trace-Id':uid(),...(o.body?{'Content-Type':'application/json'}:{}),...(o.headers||{})};
 let st,data;
 if(!REAL){await sleep(80);try{[st,data]=mock(method,path,o.query||{},o.body,h)}catch(e){st=e.status||500;data={code:e.code||'INTERNAL_ERROR',message:e.message}}}
 else{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),12000);
  try{const r=await fetch('/api/core'+path+q,{method,headers:h,body:o.body?JSON.stringify(o.body):undefined,signal:ac.signal});st=r.status;data=await r.json().catch(()=>null)}
  catch{const e=new Error('network');e.code='NETWORK';e.status=0;throw e}finally{clearTimeout(tm)}}
 LOG.unshift({m:method,p:path+q,h,b:scrub(o.body),s:st,r:scrub(data)});LOG.length=Math.min(LOG.length,40);$('#log').innerHTML=LOG.map(l=>`<details><summary><b>${l.m}</b> ${esc(l.p)} → ${l.s}</summary><pre>${logText(t('log.headers')+' '+JSON.stringify(l.h,null,1)+'\n'+t('log.requestBody')+' '+JSON.stringify(l.b??null,null,1)+'\n'+t('log.response')+' '+JSON.stringify(l.r,null,1))}</pre></details>`).join('');

function submitClarification(id){const box=document.querySelector(`[data-cf="${id}"]`);if(!box)return;const v={};let invalid=false;box.querySelectorAll('[data-field]').forEach(x=>{let value=x.value.trim();if(x.dataset.optionMap){const opts=JSON.parse(x.dataset.optionMap),q=value.toLowerCase(),match=opts.find(o=>{const label=o.label.toLowerCase();return label==q||label.startsWith(q+'（')||label.includes('（'+q+'）')||String(o.value).toLowerCase()==q});if(!match){invalid=true;return}value=match.value}v[x.dataset.field]=value});if(invalid){note(esc(t('ai.chooseSavedRecipient')));return}if([...box.querySelectorAll('[required]')].some(x=>!x.value.trim())){note(esc(t('ai.requiredFields')));return}if(v.month_date&&/^\d{4}-\d{2}$/.test(v.month_date))v.month_date+='-01';let out;if(box.dataset.intent=='TRANSFER')out=t('ai.transferIntent',{src:v.source_account_id,dst:v.destination_account_id,amount:v.amount});else if(box.dataset.intent=='CREATE_SAVINGS_POT')out=t('ai.potIntent',{name:v.name,amount:v.target_amount,date:v.target_date});else if(box.dataset.intent=='CREATE_BUDGET')out=t('ai.budgetIntent',{category:v.category,month:v.month_date,amount:v.limit_amount});else out=t('ai.confirmForm',{fields:Object.entries(v).map(([k,x])=>`${k}=${x}`).join(', ')});send(out,{intent:box.dataset.intent,fields:v})}
function taskApproval(r){const ss=r.plan&&r.plan.steps||[],s=[...ss].reverse().find(x=>x.tool_call),c=s&&s.tool_call;if(!c)return null;const a=c.arguments||{},draft={create_transfer_draft:['transfer.commit',t('op.transfer.commit')],create_wealth_subscription_draft:['wealth.subscribe',t('op.wealth.subscribe')],create_wealth_redemption_draft:['wealth.redeem',t('op.wealth.redeem')]}[c.tool_name],direct={cancel_subscription:['subscription.cancel',t('op.subscription.cancel')],update_card_limit:['card.limit',t('op.card.limit')],freeze_card:['card.freeze',t('op.card.freeze')],unfreeze_card:['card.unfreeze',t('op.card.unfreeze')],report_card_lost:['card.report_lost',t('op.card.report_lost')]}[c.tool_name],cfg=draft||direct;if(!cfg)return null;const op=draft&&r.result?r.result.id:(a.resource_id||a.card_id);if(!op)return null;const amount=(r.result&&r.result.amount)||a.amount||a.spending_limit;return{type:cfg[0],title:cfg[1],op,amount,rows:[[t('common.action'),cfg[1]],[t('common.resourceId'),op],...(amount?[[t('common.amount'),money(amount)]]:[])]}}
async function tryBackendAgent(t,conversation,confirmation){if(!AGENT_REAL){bot('<span style="color:var(--r)">'+esc(tr('ai.agentOffline'))+'</span>');return true}let r;const started=performance.now(),body={schema_version:'v1',session_id:AGENT_SESSION,message:t,conversation,locale:loc()};if(confirmation)body.confirmation=confirmation;try{r=await agentApi('/tasks',body);r.agent_elapsed_ms=Math.round(performance.now()-started)}catch(e){AGENT_REAL=false;agentState='unavailable';renderConn();AUD.push([ts(),'AGENT_UNAVAILABLE','RED','EXECUTION_ERROR',e.code||e.message]);bot('<span style="color:var(--r)">'+esc(tr('ai.agentFailed'))+'</span>');return true}
 const steps=r.plan&&r.plan.steps||[];if(steps.length)dag(steps.map(s=>s.step_id));steps.forEach(s=>{mark(s.step_id,r.status=='FAILED'?'err':'ok');trace(s.tool_call&&s.tool_call.tool_name||s.step_id,'INFO',s.tool_call&&s.tool_call.arguments||{},r.status,{purpose:s.purpose})});
 AUD.push([ts(),'BACKEND_AGENT_TASK','INFO',r.status,`${r.id} · ${r.agent_elapsed_ms}ms · ${r.public_message||''}`]);if(r.status=='COMPLETED'){remember('assistant',r.public_message||tr('ai.completed'));bot(agentResult(r)+agentTiming(r));return true}if(r.status=='NEEDS_CLARIFICATION'){remember('assistant','[CLARIFICATION] '+(r.public_message||tr('ai.clarifyNeed')));bot(clarificationHtml(r));return true}if(r.status=='WAITING_APPROVAL'){remember('assistant',r.public_message||tr('ai.awaitingApproval'));const ap=taskApproval(r);if(!ap){bot(`${esc(r.public_message||tr('ai.awaitingApproval'))}<br><span class="mut">${esc(tr('ai.resumeUnsupported',{id:r.id}))}</span>${agentTiming(r)}`);return true}const ref=await authorize(ap.type,ap.op,ap.rows,ap.title,ap.amount);if(!ref){bot(esc(tr('ai.noSensitiveAction')));return true}const rr=await agentApi('/tasks/'+r.id+'/resume',{authorization_reference:ref});AUD.push([ts(),'BACKEND_AGENT_RESUME','INFO',rr.status,rr.id]);remember('assistant',rr.public_message||rr.status);bot(rr.status=='COMPLETED'?agentResult(rr):`<span style="color:var(--r)">${esc(rr.public_message||rr.error_code||tr('ai.resumeFailed'))}</span>`);return true}remember('assistant',r.public_message||tr('ai.taskFailed'));bot(`<span style="color:var(--r)">${esc(r.public_message||r.error_code||tr('ai.taskFailed'))}</span>${agentTiming(r)}`);return true}
async function send(t,confirmation=null){if(AI.locked){bot(esc(tr('ai.locked')));return}const sensitive=/(?:密码|口令|password)\s*(?:是|为|[:：=])?\s*\S{4,}|(?:验证码|动态码|otp|mfa)\s*(?:是|为|[:：=])?\s*\d{4,8}|(?:cvv|cvc|安全码)\s*(?:是|为|[:：=])?\s*\d{3,4}|(?:卡号|银行卡号|card\s*number)\s*(?:是|为|[:：=])?\s*[\d -]{13,25}/i;if(sensitive.test(t)){me(tr('ai.sensitiveBlocked'));bot(esc(tr('ai.sensitiveWarning')));return}const conversation=AI.history.slice(-10);me(t);remember('user',t);
 if(INJ.test(t)){AI.blocked++;AUD.push([ts(),'INJECTION_BLOCKED','RED','DENIED',t.slice(0,60)]);bot(esc(tr('ai.injectionRefusal')));if(AI.blocked>=3)lockAI(tr('ai.lockSuspicious'));return}
 AI.abort=false;try{await tryBackendAgent(t,conversation,confirmation)}catch(e){if(e.code=='INTERRUPTED')bot('⏹ '+esc(tr('ai.interrupted')));else bot(`<span style="color:var(--r)">${esc(emsg(e))}</span>`)}}
/* ===== 启动：分别检测 Banking Core 与 Agent ===== */
(async()=>{applyStatic();const probe=async path=>{try{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),1800),r=await fetch(path,{signal:ac.signal});clearTimeout(tm);return r.ok}catch{return false}};
 REAL=await probe('/api/core/health');AGENT_REAL=await probe('/api/agent/openapi.json');
 coreState=REAL?'connected':'demo';agentState=AGENT_REAL?'connected':'offline';renderConn();go('home')})();
