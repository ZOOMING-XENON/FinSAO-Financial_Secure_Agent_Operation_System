<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">

<style>

*{box-sizing:border-box}html,body{height:100%;margin:0}

</style></head><body>
<div class="shell"><header><b>FinSAO</b><span class="pill INFO" id="mode">Core 检测中…</span><span class="pill INFO" id="agentmode">Agent 检测中…</span><span class="sp"></span><button id="devb">JSON 日志</button></header><nav id="nav"></nav><main id="main"></main></div>

<div class="ov" id="ov"><div class="sheet" id="sh"></div></div>
<div id="dev"><b>请求 / 响应（JSON 传输规范）</b><div id="log"></div></div>
<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));

const PTY={MONEY_MARKET_FUND:'货币基金',BOND_FUND:'债券基金',GOVERNMENT_BOND:'国债',FIXED_INCOME:'固定收益'};
const EM={INSUFFICIENT_FUNDS:'余额不足',AUTHORIZATION_REQUIRED:'授权无效、已过期或验证码错误',FORBIDDEN:'无权访问，或验证失败过多已被安全锁定',NOT_FOUND:'资源不存在',CONFLICT:'状态冲突，请刷新后重试',VALIDATION_ERROR:'请求校验失败，请检查输入',INTERNAL_ERROR:'服务异常，请稍后重试',HTTP_ERROR:'身份不可用：请检查后端 DEVELOPMENT_USER_ID 与 APP_ENV=development',BANKING_ERROR:'业务操作无效',NETWORK:'网络超时，结果未知'};
const emsg=e=>EM[e.code]||e.message||'未知错误';
const money=(s,c)=>{const p=String(s).split('.');return (CUR[c||'CNY']||'')+p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',')+'.'+((p[1]||'')+'00').slice(0,2)};
const cents=s=>{const p=String(s).split('.');return BigInt(p[0])*100n+BigInt(((p[1]||'')+'00').slice(0,2))};
const cs=n=>{if(n<0n)n=0n;return (n/100n)+'.'+String(n%100n).padStart(2,'0')};
const AMT=/^\d{1,16}(\.\d{1,2})?$/,pill=v=>`<span class="pill ${v}">${esc(ST[v]||v)}</span>`,uid=()=>crypto.randomUUID();
const fdate=s=>s?new Date(s).toLocaleDateString('zh-CN'):'—';
let REAL=false,AGENT_REAL=false;const LOG=[],ts=()=>new Date().toLocaleTimeString('zh-CN'),scrub=o=>JSON.parse(JSON.stringify(o??null,(k,v)=>['authorization_ref','authorization_reference','mfa_code'].includes(k)||(k=='code'&&/^\d{6}$/.test(String(v)))?'[已隐藏]':['account_number','destination_account_number'].includes(k)?'••••'+String(v).slice(-4):v));
/* ===== API：严格遵循 JSON 传输规范 ===== */
async function api(method,path,o={}){
 const q=o.query?'?'+new URLSearchParams(Object.entries(o.query).filter(([,v])=>v!==''&&v!=null)):'';
 const h={Accept:'application/json','X-Trace-Id':uid(),...(o.body?{'Content-Type':'application/json'}:{}),...(o.headers||{})};
 let st,data;
 if(!REAL){await sleep(80);try{[st,data]=mock(method,path,o.query||{},o.body,h)}catch(e){st=e.status||500;data={code:e.code||'INTERNAL_ERROR',message:e.message}}}
 else{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),12000);
  try{const r=await fetch('/api/core'+path+q,{method,headers:h,body:o.body?JSON.stringify(o.body):undefined,signal:ac.signal});st=r.status;data=await r.json().catch(()=>null)}
  catch{const e=new Error('network');e.code='NETWORK';e.status=0;throw e}finally{clearTimeout(tm)}}
 LOG.unshift({m:method,p:path+q,h,b:scrub(o.body),s:st,r:scrub(data)});LOG.length=Math.min(LOG.length,40);$('#log').innerHTML=LOG.map(l=>`<details><summary><b>${l.m}</b> ${esc(l.p)} → ${l.s}</summary><pre>${esc('请求头 '+JSON.stringify(l.h,null,1)+'\n请求体 '+JSON.stringify(l.b??null,null,1)+'\n响应 '+JSON.stringify(l.r,null,1))}</pre></details>`).join('');
 if(st>=400){const e=new Error(data&&data.message);e.status=st;e.code=data&&data.code;throw e}
 return data}
async function agentApi(path,body){const h={Accept:'application/json','Content-Type':'application/json','X-Trace-Id':uid()},ac=new AbortController(),tm=setTimeout(()=>ac.abort(),15000);let st,data;
 try{const r=await fetch('/api/agent'+path,{method:'POST',headers:h,body:JSON.stringify(body),signal:ac.signal});st=r.status;data=await r.json().catch(()=>null)}
 catch{const e=new Error('agent network');e.code='AGENT_UNAVAILABLE';e.status=0;throw e}finally{clearTimeout(tm)}
 LOG.unshift({m:'POST',p:'/api/agent'+path,h,b:scrub(body),s:st,r:scrub(data)});LOG.length=Math.min(LOG.length,40);$('#log').innerHTML=LOG.map(l=>`<details><summary><b>${l.m}</b> ${esc(l.p)} → ${l.s}</summary><pre>${esc('请求头 '+JSON.stringify(l.h,null,1)+'\n请求体 '+JSON.stringify(l.b??null,null,1)+'\n响应 '+JSON.stringify(l.r,null,1))}</pre></details>`).join('');
 if(st>=400){const detail=data&&data.detail,e=new Error(detail&&detail.message||data&&data.message||'Agent 请求失败');e.status=st;e.code=detail&&detail.code||data&&data.code||'AGENT_ERROR';throw e}return data}
/* ===== 内置模拟后端：镜像真实后端的种子数据与规则（仅无后端时使用）===== */
const U=n=>'00000000-0000-4000-8000-'+String(n).padStart(12,'0');
const DEMO_PAYEES=[['爸爸','299000000001',U(201)],['妈妈','390000000002',U(202)],['爷爷','299000000003',U(203)],['奶奶','390000000004',U(204)],['外公','299000000005',U(205)],['外婆','390000000006',U(206)],['哥哥','299000000007',U(207)],['姐姐','390000000008',U(208)],['好友小王','299000000009',U(209)],['好友小李','390000000010',U(210)]];
const D={acc:[{id:U(1),account_number:'DEMO0101000001',name:'Checking',currency:'CNY',status:'ACTIVE'},{id:U(2),account_number:'DEMO0102000001',name:'Savings',currency:'CNY',status:'ACTIVE'}],
 bal:{[U(1)]:'11572.20',[U(2)]:'30000.00'},directory:{'DEMO0201000001':U(3),'DEMO0301000001':U(4),...Object.fromEntries(DEMO_PAYEES.map(([,number,id])=>[number,id]))},ben:[{id:U(11),name:'Demo Friend',nickname:'Friend',destination_account_id:U(3),destination_account_number:'DEMO0201000001'},...DEMO_PAYEES.map(([name,number,id],i)=>({id:U(300+i),name,nickname:null,destination_account_id:id,destination_account_number:number}))],
 tx:[['100','DEMO-OPENING-LIN-CHECKING','12000.00','OPENING_BALANCE','2026-01-01T08:00:00Z',1,0,'Deterministic demo opening balance'],['101','DEMO-OPENING-LIN-SAVINGS','30000.00','OPENING_BALANCE','2026-01-01T08:00:00Z',2,0,'Deterministic demo opening balance'],
  ['102','DEMO-EXPENSE-LIN-2026-01','128.40','HOUSEHOLD','2026-01-15T12:00:00Z',1,1],['103','DEMO-EXPENSE-LIN-2026-02','156.80','HOUSEHOLD','2026-02-15T12:00:00Z',1,1],['104','DEMO-EXPENSE-LIN-2026-03','142.60','HOUSEHOLD','2026-03-15T12:00:00Z',1,1]]
  .map(a=>({id:U(a[0]),reference:a[1],status:'COMPLETED',amount:a[2],currency:'CNY',description:a[7]||'Fictional monthly household purchase',category:a[3],posted_at:a[4],acct:U(a[5]),out:!!a[6]})),
 drafts:{},keys:{},appr:{},ch:{},auth:{},risk:null,hold:[],orders:{},okeys:{},rem:[],
 bud:[{id:U(51),category:'HOUSEHOLD',month:'2026-03-01',limit_amount:'1500.00',currency:'CNY'}],
 sub:[{id:U(41),merchant_name:'Demo Stream Lin',amount:'25.00',currency:'CNY',next_billing_date:'2026-04-15',active:true,status:'ACTIVE',cancelled_at:null}],
 card:[{id:U(31),account_id:U(1),label:'Fictional Demo Card',last_four:'1000',status:'ACTIVE',spending_limit:'5000.00'}],
 prod:[['MMF-01','Demo Liquidity Fund','MONEY_MARKET_FUND','GREEN','100.00',1],['BOND-01','Demo Steady Bond Fund','BOND_FUND','YELLOW','1000.00',1],['GOV-01','Demo Government Bond','GOVERNMENT_BOND','GREEN','1000.00',1],['FIXED-01','Demo Fixed Income Plan','FIXED_INCOME','YELLOW','5000.00',0]].map((p,i)=>({id:U(60+i),code:'DEMO-'+p[0],name:p[1],product_type:p[2],risk_tier:p[3],minimum_amount:p[4],currency:'CNY',supports_redemption:!!p[5]}))};
const RK={GREEN:1,YELLOW:2,RED:3},MFA_CODE='123456';
const er=(s,c,m)=>Object.assign(new Error(m||c),{status:s,code:c});
function chk(ref,op,type){const a=D.auth[ref];if(!a||a.used||a.op!==op||a.type!==type||Date.parse(a.exp)<Date.now())throw er(403,'AUTHORIZATION_REQUIRED','invalid authorization');a.used=true}
function grant(ap){const ref=uid(),exp=new Date(Date.now()+600000).toISOString();D.auth[ref]={op:ap.operation_id,type:ap.operation_type,exp,used:false};ap.status='CONFIRMED';return{authorization_ref:ref,expires_at:exp}}
function spend(y,m){const k=y+'-'+String(m).padStart(2,'0'),o={total:0n,c:{},m:{}};D.tx.filter(t=>t.out&&!['INTERNAL_TRANSFER','OPENING_BALANCE'].includes(t.category)&&t.posted_at.startsWith(k)).forEach(t=>{const a=cents(t.amount);o.total+=a;o.c[t.category]=(o.c[t.category]||0n)+a;o.m[t.description]=(o.m[t.description]||0n)+a});
 const f=x=>Object.fromEntries(Object.entries(x).map(([a,b])=>[a,cs(b)]));return{total:cs(o.total),by_category:f(o.c),by_merchant:f(o.m)}}
const outToday=()=>Object.values(D.drafts).reduce((s,d)=>s+cents(d.amount),0n);
function mock(M,P,Q,B,H){let m;const own=id=>D.acc.find(a=>a.id==id);
 if(M=='GET'&&P=='/health')return[200,{status:'ok'}];
 if(M=='GET'&&P=='/accounts')return[200,D.acc];
 if(m=P.match(/^\/accounts\/([^/]+)\/balance$/)){const a=own(m[1]);if(!a)throw er(404,'NOT_FOUND');return[200,{account_id:a.id,balance:D.bal[a.id],currency:a.currency}]}
 if(m=P.match(/^\/accounts\/([^/]+)\/transactions$/)){if(!own(m[1]))throw er(404,'NOT_FOUND');const L=Math.min(200,Math.max(1,+Q.limit||50)),O=Math.max(0,+Q.offset||0);
  const r=D.tx.filter(x=>x.acct==m[1]&&(!Q.category||x.category==Q.category)&&(!Q.merchant||x.description.toLowerCase().includes(Q.merchant.toLowerCase()))&&(!Q.minimum_amount||cents(x.amount)>=cents(Q.minimum_amount))&&(!Q.maximum_amount||cents(x.amount)<=cents(Q.maximum_amount))).sort((a,b)=>a.posted_at<b.posted_at?1:-1);
  return[200,{items:r.slice(O,O+L).map(({acct,out,...t})=>t),limit:L,offset:O}]}
 if(m=P.match(/^\/transactions\/([^/]+)\/category$/)){const t=D.tx.find(x=>x.id==m[1]);if(!t)throw er(404,'NOT_FOUND');t.category=String(B.category).trim().toUpperCase();const{acct,out,...r}=t;return[200,r]}
 if(M=='GET'&&P=='/beneficiaries')return[200,D.ben];
 if(M=='GET'&&P=='/beneficiaries/resolve'){const q=(Q.query||'').trim().toLowerCase(),f=D.ben.filter(b=>b.name.toLowerCase()==q||(b.nickname||'').toLowerCase()==q);return[200,{status:f.length?f.length>1?'AMBIGUOUS':'RESOLVED':'NOT_FOUND',matches:f}]}
 if(M=='POST'&&P=='/beneficiaries'){const name=String(B.name||'').trim(),num=String(B.account_number||'').trim();if(!name||!num)throw er(422,'VALIDATION_ERROR');const dest=D.directory[num];if(!dest)throw er(404,'NOT_FOUND','destination account not found');let b=D.ben.find(x=>x.destination_account_id==dest);if(b){b.name=name;b.nickname=B.nickname||null;b.destination_account_number=num}else{b={id:uid(),name,nickname:B.nickname||null,destination_account_id:dest,destination_account_number:num};D.ben.push(b)}return[201,b]}
 if(M=='POST'&&P=='/transfers/drafts'){const k=H['Idempotency-Key'];if(!k||k.length>120)throw er(422,'VALIDATION_ERROR');
  if(!AMT.test(B.amount)||cents(B.amount)<=0n||B.source_account_id==B.destination_account_id)throw er(422,'VALIDATION_ERROR');
  if(D.keys[k]){const d=D.drafts[D.keys[k]];if(d.amount!=B.amount||d.destination_account_id!=B.destination_account_id)throw er(409,'CONFLICT','idempotency key reused');return[200,d]}
  if(!own(B.source_account_id))throw er(404,'NOT_FOUND');
  const d={id:uid(),source_account_id:B.source_account_id,destination_account_id:B.destination_account_id,amount:cs(cents(B.amount)),currency:B.currency,status:'PENDING_AUTHORIZATION',expires_at:new Date(Date.now()+900000).toISOString(),transaction_id:null};D.drafts[d.id]=d;D.keys[k]=d.id;return[201,d]}
 if(M=='GET'&&(m=P.match(/^\/transfers\/(?:drafts\/)?([^/]+)$/))){const d=Object.values(D.drafts).find(x=>x.id==m[1]||x.transaction_id==m[1]);if(!d)throw er(404,'NOT_FOUND');return[200,d]}
 if(M=='POST'&&P=='/security/approvals'){const t=B.operation_type;let tier='YELLOW',amt=null,cur=null,tid=null,rid=null;
  if(t=='transfer.commit'){const d=D.drafts[B.operation_id];if(!d)throw er(404,'NOT_FOUND');amt=d.amount;cur=d.currency;tid=d.source_account_id;rid=d.destination_account_id;if(outToday()>100000n)tier='RED'}

function lockAI(why){AI.locked=true;AUD.push([ts(),'CIRCUIT_BREAKER','RED','DENIED',why]);bot(`🔒 <b>已触发异常熔断</b>：${esc(why)}。助手已锁定，本会话内资金类操作暂停；请刷新页面或联系人工客服。`);const i=$('#ai-in');if(i)i.disabled=true}
function dag(nodes){$('#msgs').insertAdjacentHTML('beforeend',`<div class="tr"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><b>任务计划（DAG）</b>${nodes.map((n,i)=>`${i?'<span class="mut">→</span>':''}<span class="pill INFO" data-n="${n}">○ ${n}</span>`).join('')}<button class="btn s" onclick="AI.abort=true">⏹ 中断</button></div></div>`);keep()}
function mark(n,s){const el=[...document.querySelectorAll(`[data-n="${n}"]`)].pop();if(!el)return;const m={run:['◐','WAITING_APPROVAL'],ok:['✓','SUCCESS'],err:['✗','DENIED']}[s];el.className='pill '+m[1];el.textContent=m[0]+' '+n;AI.html=$('#msgs').innerHTML}
function showAudit(){modal(`<h3>决策链路 / 审计（本会话）</h3><div class="mut">客户端记录的 Agent 决策与工具调用（授权凭据已隐藏）；后端 audit_events 表另行持久化关键操作（暂无查询接口）。</div>`+(AUD.length?AUD.map(a=>`<div class="row" style="display:block"><span class="mut k">${a[0]}</span> <code>${esc(a[1])}</code> ${pill(a[2])} ${pill(a[3])}<div class="k mut">${esc(a[4])}</div></div>`).join(''):'<div class="empty">暂无记录</div>')+'<br><button class="btn p" id="okb">关闭</button>');$('#okb').onclick=unmodal}
const RESULT_LABEL={category:'类别',month:'月份',limit_amount:'预算上限',amount:'金额',currency:'币种',status:'状态',account_number:'账号',name:'名称',label:'卡片',last_four:'尾号',spending_limit:'消费限额',merchant_name:'商户',next_billing_date:'下次扣款',active:'是否有效',product_type:'产品类型',risk_tier:'风险等级',minimum_amount:'起投金额',supports_redemption:'可赎回',target_amount:'目标金额',saved_amount:'已存金额',target_date:'目标日期',allocation_mode:'分配方式',description:'说明',posted_at:'入账时间',reference:'参考号',total:'总支出',used:'已用',remaining:'剩余',estimate:'预估',threshold_exceeded:'超出预算',score:'评分',order_type:'操作类型'};
const MONEY_KEYS=new Set(['balance','amount','limit_amount','spending_limit','minimum_amount','target_amount','saved_amount','total','used','remaining','estimate']);
const lastAgentTool=r=>{const steps=r.plan&&r.plan.steps||[],s=[...steps].reverse().find(v=>v.tool_call);return s&&s.tool_call&&s.tool_call.tool_name||''};
function resultValue(k,v,o={}){if(v==null)return '—';if(MONEY_KEYS.has(k))return money(v,o.currency);if(k=='category')return CAT[v]||v;if(k=='product_type')return PTY[v]||v;if(k=='status'||k=='risk_tier')return ST[v]||v;if(typeof v=='boolean')return v?'是':'否';if(/(?:_at|_date|month)$/.test(k))return fdate(v);if(k=='account_number')return '•••• '+String(v).slice(-4);if(k=='last_four')return '•••• '+v;return String(v)}
function resultRows(o,skip=[]){const hidden=new Set(['id','account_id','source_account_id','destination_account_id','product_id','transaction_id','created_at','updated_at',...skip]);return Object.entries(o).filter(([k,v])=>!hidden.has(k)&&v!=null&&typeof v!='object').map(([k,v])=>`<div class="row"><span class="mut">${esc(RESULT_LABEL[k]||k.replaceAll('_',' '))}</span><span>${k=='status'||k=='risk_tier'?pill(String(v)):esc(resultValue(k,v,o))}</span></div>`).join('')}
function resultCard(title,o,leadKey){const lead=leadKey&&o[leadKey]!=null?`<div class="amount">${esc(resultValue(leadKey,o[leadKey],o))}</div>`:'';return `<section class="result-card"><h4>${esc(title)}</h4>${lead}${resultRows(o,leadKey?[leadKey]:[])}</section>`}
function agentResult(r){const x=r.result,msg=r.public_message||'Agent 已完成任务。',tool=lastAgentTool(r);if(!x)return esc(msg);let cards=[];if(Array.isArray(x.accounts))cards=x.accounts.map(a=>resultCard(a.name||'账户',a));else if(x.balance!=null)cards=[resultCard('账户余额',x,'balance')];else if(Array.isArray(x.items)){cards=x.items.map((v,i)=>{let title=v.name||v.label||v.merchant_name||v.merchant||v.description||`结果 ${i+1}`,lead=null;if(tool=='list_budgets'){title=CAT[v.category]||v.category||'预算';lead='limit_amount'}else if(tool=='list_subscriptions')lead='amount';else if(tool=='list_cards')lead='spending_limit';else if(/wealth/.test(tool))lead=v.amount!=null?'amount':'minimum_amount';else if(/savings/.test(tool))lead=v.saved_amount!=null?'saved_amount':v.amount!=null?'amount':null;else if(tool=='get_transactions')lead='amount';return resultCard(title,v,lead)});}else if(typeof x=='object'){const title={create_budget:'预算详情',update_budget:'预算详情',get_budget_status:'预算使用情况',analyze_spending:'消费分析',create_transfer_draft:'转账草稿'}[tool]||'操作结果',lead=x.total!=null?'total':x.amount!=null?'amount':x.limit_amount!=null?'limit_amount':null;cards=[resultCard(title,x,lead)];if(x.by_category&&typeof x.by_category=='object')cards.push(resultCard('按类别',Object.fromEntries(Object.entries(x.by_category).map(([k,v])=>[CAT[k]||k,v]))));}if(!cards.length)return `<div class="result-summary">${esc(msg)}</div>`;return `<div class="result-summary"><span>${esc(msg)}</span>${pill(r.status||'COMPLETED')}</div><div class="result-grid">${cards.join('')}</div>`}
const agentTiming=r=>r.agent_elapsed_ms==null?'':`<div class="mut" style="margin-top:6px">Agent / LLM 处理耗时：${r.agent_elapsed_ms} ms</div>`;
function clarificationHtml(r){const c=r.result&&r.result.clarification;if(!c)return esc(r.public_message||'请补充完成任务所需的信息。')+agentTiming(r);const fields=c.fields||[];return `<div>${esc(r.public_message||'请检查以下信息。')}</div>${agentTiming(r)}<div class="card" data-cf="${esc(r.id)}" data-intent="${esc(c.intent)}">${fields.map(f=>{const raw=f.value==null?'':String(f.value),val=f.input_type=='month'?raw.slice(0,7):raw,tip=f.inferred?' <span class="pill YELLOW">待确认</span>':'',opts=f.options||[],lid=`choices-${r.id}-${f.name}`;if(f.input_type=='combobox'&&f.name=='destination_account_id'){const chosen=opts.find(o=>String(o.value)==raw),shown=chosen?chosen.label:'',map=JSON.stringify(opts);return `<label>${esc(f.label)}${tip}</label><input data-field="${esc(f.name)}" data-option-map="${esc(map)}" list="${esc(lid)}" value="${esc(shown)}" autocomplete="off" placeholder="输入姓名，或选择以前转账过的人" ${f.required?'required':''}><datalist id="${esc(lid)}">${opts.map(o=>`<option value="${esc(o.label)}"></option>`).join('')}</datalist><div class="mut">这里只显示已保存的收款人；首次收款人请先在“转账”页面填写姓名和收款账户。</div>`}if(f.input_type=='combobox')return `<label>${esc(f.label)}${tip}</label><input data-field="${esc(f.name)}" list="${esc(lid)}" value="${esc(val)}" placeholder="选择已有类别，或直接输入新类别" ${f.required?'required':''}><datalist id="${esc(lid)}">${opts.map(o=>`<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('')}</datalist><div class="mut">列表中没有时可直接输入，新类别会随预算一起创建。</div>`;if(opts.length)return `<label>${esc(f.label)}${tip}</label><select data-field="${esc(f.name)}">${opts.map(o=>`<option value="${esc(o.value)}" ${String(o.value)==val?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;const type=f.input_type=='date'?'date':f.input_type=='month'?'month':'text';return `<label>${esc(f.label)}${tip}</label><input data-field="${esc(f.name)}" type="${type}" inputmode="${f.input_type=='amount'?'decimal':'text'}" value="${esc(val)}" ${f.required?'required':''}>`}).join('')}<button class="btn p" style="width:100%;margin-top:10px" onclick="submitClarification('${esc(r.id)}')">确认并继续</button></div>`}
function submitClarification(id){const box=document.querySelector(`[data-cf="${id}"]`);if(!box)return;const v={};let invalid=false;box.querySelectorAll('[data-field]').forEach(x=>{let value=x.value.trim();if(x.dataset.optionMap){const opts=JSON.parse(x.dataset.optionMap),q=value.toLowerCase(),match=opts.find(o=>{const label=o.label.toLowerCase();return label==q||label.startsWith(q+'（')||label.includes('（'+q+'）')||String(o.value).toLowerCase()==q});if(!match){invalid=true;return}value=match.value}v[x.dataset.field]=value});if(invalid){note('请选择一个已保存的收款人；首次收款人请先到“转账”页面添加');return}if([...box.querySelectorAll('[required]')].some(x=>!x.value.trim())){note('请填写所有必填信息');return}if(v.month_date&&/^\d{4}-\d{2}$/.test(v.month_date))v.month_date+='-01';let t;if(box.dataset.intent=='TRANSFER')t=`从账户 ${v.source_account_id} 向账户 ${v.destination_account_id} 转账 ${v.amount} 元`;else if(box.dataset.intent=='CREATE_SAVINGS_POT')t=`创建一个${v.name}储蓄罐，目标金额${v.target_amount}元，目标日期${v.target_date}`;else if(box.dataset.intent=='CREATE_BUDGET')t=`创建预算：类别 ${v.category}，月份 ${v.month_date}，限额 ${v.limit_amount} 元`;else t='确认表单：'+Object.entries(v).map(([k,x])=>`${k}=${x}`).join('，');send(t,{intent:box.dataset.intent,fields:v})}
function taskApproval(r){const ss=r.plan&&r.plan.steps||[],s=[...ss].reverse().find(x=>x.tool_call),c=s&&s.tool_call;if(!c)return null;const a=c.arguments||{},draft={create_transfer_draft:['transfer.commit','确认转账'],create_wealth_subscription_draft:['wealth.subscribe','确认理财申购'],create_wealth_redemption_draft:['wealth.redeem','确认理财赎回']}[c.tool_name],direct={cancel_subscription:['subscription.cancel','取消订阅'],update_card_limit:['card.limit','修改银行卡限额'],freeze_card:['card.freeze','冻结银行卡'],unfreeze_card:['card.unfreeze','解冻银行卡'],report_card_lost:['card.report_lost','挂失银行卡']}[c.tool_name],cfg=draft||direct;if(!cfg)return null;const op=draft&&r.result?r.result.id:(a.resource_id||a.card_id);if(!op)return null;const amount=(r.result&&r.result.amount)||a.amount||a.spending_limit;return{type:cfg[0],title:cfg[1],op,amount,rows:[['操作',cfg[1]],['资源 ID',op],...(amount?[['金额',money(amount)]]:[])]}}
async function tryBackendAgent(t,conversation,confirmation){if(!AGENT_REAL){bot('<span style="color:var(--r)">Agent 未连接，聊天不会在浏览器本地执行银行操作。</span>');return true}let r;const started=performance.now(),body={schema_version:'v1',session_id:AGENT_SESSION,message:t,conversation,locale:'zh-CN'};if(confirmation)body.confirmation=confirmation;try{r=await agentApi('/tasks',body);r.agent_elapsed_ms=Math.round(performance.now()-started)}catch(e){AGENT_REAL=false;$('#agentmode').textContent='Agent 不可用';$('#agentmode').className='pill RED';AUD.push([ts(),'AGENT_UNAVAILABLE','RED','EXECUTION_ERROR',e.code||e.message]);bot('<span style="color:var(--r)">Agent 请求失败，请检查 Agent 服务和数据库迁移。</span>');return true}
 const steps=r.plan&&r.plan.steps||[];if(steps.length)dag(steps.map(s=>s.step_id));steps.forEach(s=>{mark(s.step_id,r.status=='FAILED'?'err':'ok');trace(s.tool_call&&s.tool_call.tool_name||s.step_id,'INFO',s.tool_call&&s.tool_call.arguments||{},r.status,{purpose:s.purpose})});
 AUD.push([ts(),'BACKEND_AGENT_TASK','INFO',r.status,`${r.id} · ${r.agent_elapsed_ms}ms · ${r.public_message||''}`]);if(r.status=='COMPLETED'){remember('assistant',r.public_message||'任务已完成');bot(agentResult(r)+agentTiming(r));return true}if(r.status=='NEEDS_CLARIFICATION'){remember('assistant','[CLARIFICATION] '+(r.public_message||'请补充信息'));bot(clarificationHtml(r));return true}if(r.status=='WAITING_APPROVAL'){remember('assistant',r.public_message||'任务等待审批');const ap=taskApproval(r);if(!ap){bot(`${esc(r.public_message||'任务等待审批。')}<br><span class="mut">任务 ID：${esc(r.id)}；当前工具暂不支持聊天内恢复。</span>${agentTiming(r)}`);return true}const ref=await authorize(ap.type,ap.op,ap.rows,ap.title,ap.amount);if(!ref){bot('已取消，任务没有执行敏感操作。');return true}const rr=await agentApi('/tasks/'+r.id+'/resume',{authorization_reference:ref});AUD.push([ts(),'BACKEND_AGENT_RESUME','INFO',rr.status,rr.id]);remember('assistant',rr.public_message||rr.status);bot(rr.status=='COMPLETED'?agentResult(rr):`<span style="color:var(--r)">${esc(rr.public_message||rr.error_code||'恢复失败')}</span>`);return true}remember('assistant',r.public_message||'任务失败');bot(`<span style="color:var(--r)">${esc(r.public_message||r.error_code||'任务失败')}</span>${agentTiming(r)}`);return true}
async function send(t,confirmation=null){if(AI.locked){bot('助手已因异常熔断锁定。');return}const sensitive=/(?:密码|口令|password)\s*(?:是|为|[:：=])?\s*\S{4,}|(?:验证码|动态码|otp|mfa)\s*(?:是|为|[:：=])?\s*\d{4,8}|(?:cvv|cvc|安全码)\s*(?:是|为|[:：=])?\s*\d{3,4}|(?:卡号|银行卡号|card\s*number)\s*(?:是|为|[:：=])?\s*[\d -]{13,25}/i;if(sensitive.test(t)){me('[敏感信息已阻止]');bot('请勿在聊天中输入密码、验证码、CVV 或完整银行卡号；请使用独立安全验证界面。');return}const conversation=AI.history.slice(-10);me(t);remember('user',t);
 if(INJ.test(t)){AI.blocked++;AUD.push([ts(),'INJECTION_BLOCKED','RED','DENIED',t.slice(0,60)]);bot('⚠️ 该请求试图绕过权限或验证规则，已拒绝。权限等级由后端策略决定，不受对话内容影响。');if(AI.blocked>=3)lockAI('连续 3 次可疑指令');return}
 AI.abort=false;try{await tryBackendAgent(t,conversation,confirmation)}catch(e){if(e.code=='INTERRUPTED')bot('⏹ 任务已中断。');else bot(`<span style="color:var(--r)">${esc(emsg(e))}</span>`)}}
/* ===== 启动：分别检测 Banking Core 与 Agent ===== */
(async()=>{const probe=async path=>{try{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),1800),r=await fetch(path,{signal:ac.signal});clearTimeout(tm);return r.ok}catch{return false}};
 REAL=await probe('/api/core/health');AGENT_REAL=await probe('/api/agent/openapi.json');
 $('#mode').textContent=REAL?'Core 已连接':'Core 演示模式';$('#mode').className='pill '+(REAL?'GREEN':'INFO');
 $('#agentmode').textContent=AGENT_REAL?'Agent 已连接':'Agent 未连接';$('#agentmode').className='pill '+(AGENT_REAL?'GREEN':'YELLOW');go('home')})();
</script></body></html>
