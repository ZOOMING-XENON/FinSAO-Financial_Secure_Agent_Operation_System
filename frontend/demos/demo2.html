<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FinSAO 智能银行</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f5f9;--card:#fff;--ink:#0f1b2d;--mut:#64748b;--line:#e2e8f0;--br:#1d4ed8;--g:#15803d;--gb:#dcfce7;--y:#b45309;--yb:#fef3c7;--r:#b91c1c;--rb:#fee2e2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c2e;--ink:#e8eefc;--mut:#94a3b8;--line:#23304a;--br:#60a5fa;--g:#4ade80;--gb:#0f2e1c;--y:#fbbf24;--yb:#33260b;--r:#f87171;--rb:#3a1515}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#131c2e;--ink:#e8eefc;--mut:#94a3b8;--line:#23304a;--br:#60a5fa;--g:#4ade80;--gb:#0f2e1c;--y:#fbbf24;--yb:#33260b;--r:#f87171;--rb:#3a1515}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.shell{display:grid;grid-template-columns:200px 1fr;grid-template-rows:56px 1fr;height:100%}
header{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line)}
header b{font-size:17px}header .sp{flex:1}
header button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer}
.btn.p{background:var(--br);color:#fff;border-color:var(--br)}.btn.d{background:var(--r);color:#fff;border-color:var(--r)}.btn:disabled{opacity:.45;cursor:default}
nav{background:var(--card);border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:4px}
nav a{padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--ink)}nav a.on{background:var(--br);color:#fff}
main{overflow:auto;padding:18px 20px 150px}
h2{margin:0 0 14px;font-size:20px}h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.big{font-size:24px;font-weight:700}.mut{color:var(--mut);font-size:13px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--br)}.bar i.w{background:var(--r)}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.GREEN,.COMPLETED,.ACTIVE{background:var(--gb);color:var(--g)}.YELLOW,.PENDING_AUTHORIZATION,.FROZEN{background:var(--yb);color:var(--y)}.RED,.LOST,.CANCELLED{background:var(--rb);color:var(--r)}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:15px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}
.sk,.empty{color:var(--mut);padding:14px;text-align:center}.errb{color:var(--r);padding:10px;background:var(--rb);border-radius:10px}
.opt{display:block;padding:10px;border:1px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer}.opt.on{border-color:var(--br);outline:2px solid var(--br)}
#chat{position:fixed;left:210px;right:10px;bottom:10px;display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;z-index:3}
#chat input{border:0;background:transparent;flex:1}
.ov{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:9;padding:12px}.ov.on{display:flex}
.sheet{background:var(--card);border-radius:18px;width:100%;max-width:440px;max-height:88%;overflow:auto;padding:18px}
.otp{letter-spacing:10px;text-align:center;font-size:22px}
pre{white-space:pre-wrap;word-break:break-all;font:11px/1.4 ui-monospace,monospace;margin:4px 0;color:var(--mut)}
#dev{position:fixed;right:0;top:56px;bottom:0;width:min(420px,100%);background:var(--card);border-left:1px solid var(--line);overflow:auto;padding:12px;display:none;z-index:8}#dev.on{display:block}
@media (max-width:859px){.shell{grid-template-columns:1fr;grid-template-rows:56px 1fr 58px}
nav{grid-row:3;grid-column:1;flex-direction:row;justify-content:space-around;border:0;border-top:1px solid var(--line);padding:4px}
nav a{padding:6px 4px;font-size:12px;text-align:center;flex:1}main{padding:14px 12px 140px}
#chat{left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom,0px))}}
</style></head><body>
<div class="shell">
<header><b>FinSAO</b><span class="mut" id="who">演示用户 · 林</span><span class="sp"></span><button id="devb">JSON 日志</button></header>
<nav id="nav"></nav><main id="main"></main></div>
<div id="chat"><input id="ci" placeholder="问 FinSAO，例如：转 800 元给小王" aria-label="聊天输入"><button class="btn" id="mic">🎤</button><button class="btn p" id="cs">发送</button></div>
<div class="ov" id="ov"><div class="sheet" id="sh"></div></div>
<div id="dev"><b>请求 / 响应（遵循 JSON 传输规范）</b><div id="log"></div></div>
<script>
/* ===== 配置：联调真实后端时 USE_MOCK=false（需同源代理或 CORS）===== */
var USE_MOCK=true, API_BASE='http://127.0.0.1:8000';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var CUR={CNY:'¥',USD:'$',EUR:'€'},CAT={HOUSEHOLD:'家居',FOOD:'餐饮',TRANSPORT:'交通',ENTERTAINMENT:'娱乐'};
var ST={ACTIVE:'有效',FROZEN:'冻结',LOST:'挂失',CANCELLED:'已取消',COMPLETED:'已完成',PENDING_AUTHORIZATION:'待授权',GREEN:'绿色·读取',YELLOW:'黄色·需确认',RED:'红色·需验证码'};
var EM={INSUFFICIENT_FUNDS:'余额不足',AUTHORIZATION_REQUIRED:'授权无效、已过期或验证码错误',FORBIDDEN:'无权访问或已被安全锁定',NOT_FOUND:'资源不存在',CONFLICT:'状态冲突，请刷新后重试',VALIDATION_ERROR:'请求校验失败，请检查输入',INTERNAL_ERROR:'服务异常，请稍后重试',HTTP_ERROR:'身份不可用',NETWORK:'网络超时，结果未知'};
function emsg(e){return EM[e.code]||e.message||'未知错误'}
function money(s,c){var p=String(s).split('.'),a=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return(CUR[c||'CNY']||'')+a+'.'+((p[1]||'')+'00').slice(0,2)}
function cents(s){var p=String(s).split('.');return BigInt(p[0])*100n+BigInt(((p[1]||'')+'00').slice(0,2))}
function cs(n){if(n<0n)n=0n;return (n/100n)+'.'+String(n%100n).padStart(2,'0')}
function pill(v){return '<span class="pill '+v+'">'+esc(ST[v]||v)+'</span>'}
function uid(){return crypto.randomUUID()}

/* ===== API 封装：snake_case、十进制字符串金额、X-Trace-Id、Idempotency-Key ===== */
var LOG=[];
async function api(method,path,o){o=o||{};var q=o.query?'?'+new URLSearchParams(Object.entries(o.query).filter(function(e){return e[1]!==''&&e[1]!=null})):'';
 var h={'Accept':'application/json','X-Trace-Id':uid()};if(o.body)h['Content-Type']='application/json';Object.assign(h,o.headers||{});
 var res;
 if(USE_MOCK){await new Promise(function(r){setTimeout(r,120)});try{res=mock(method,path,o.query||{},o.body,h)}catch(e){res=[e.status||500,{code:e.code||'INTERNAL_ERROR',message:e.message}]}}
 else{try{var r=await fetch(API_BASE+path+q,{method:method,headers:h,body:o.body?JSON.stringify(o.body):undefined});res=[r.status,await r.json().catch(function(){return null})]}catch(e){var er=new Error('network');er.code='NETWORK';er.status=0;throw er}}
 LOG.unshift({m:method,p:path+q,h:h,b:o.body,s:res[0],r:res[1]});LOG.length=Math.min(LOG.length,30);drawLog();
 if(res[0]>=400){var e2=new Error(res[1]&&res[1].message);e2.status=res[0];e2.code=res[1]&&res[1].code;throw e2}
 return res[1]}
function drawLog(){$('#log').innerHTML=LOG.map(function(l){return '<details><summary><b>'+l.m+'</b> '+esc(l.p)+' → '+l.s+'</summary><pre>请求头 '+esc(JSON.stringify(l.h,null,1))+'\n请求体 '+esc(JSON.stringify(l.b==null?null:l.b,null,1))+'\n响应 '+esc(JSON.stringify(l.r,null,1))+'</pre></details>'}).join('')}

/* ===== 内置模拟后端（仅用于演示，响应结构与规范一致）===== */
var U=function(n){return '00000000-0000-4000-8000-'+String(n).padStart(12,'0')};
var DB={acc:[{id:U(1),account_number:'6222 **** 4821',name:'活期账户',currency:'CNY',status:'ACTIVE'},{id:U(2),account_number:'6222 **** 7730',name:'储蓄账户',currency:'CNY',status:'ACTIVE'}],
 bal:{},ben:[{id:U(11),name:'王伟',nickname:'小王',destination_account_id:U(21)},{id:U(12),name:'王芳',nickname:'小王',destination_account_id:U(22)},{id:U(13),name:'妈妈',nickname:null,destination_account_id:U(23)}],
 tx:[],drafts:{},keys:{},appr:{},ch:{},auth:{},out:0n,
 bud:[{id:U(51),category:'HOUSEHOLD',month:'2026-10-01',limit_amount:'1500.00',currency:'CNY'},{id:U(52),category:'FOOD',month:'2026-10-01',limit_amount:'1000.00',currency:'CNY'},{id:U(53),category:'TRANSPORT',month:'2026-10-01',limit_amount:'300.00',currency:'CNY'}],
 sub:[{id:U(41),merchant_name:'StreamPlus',amount:'45.00',currency:'CNY',next_billing_date:'2026-11-03',active:true,status:'ACTIVE',cancelled_at:null},{id:U(42),merchant_name:'CloudDrive',amount:'21.00',currency:'CNY',next_billing_date:'2026-11-08',active:true,status:'ACTIVE',cancelled_at:null},{id:U(43),merchant_name:'FitClub',amount:'199.00',currency:'CNY',next_billing_date:'2026-11-15',active:true,status:'ACTIVE',cancelled_at:null}],
 card:[{id:U(31),account_id:U(1),label:'借记卡',last_four:'1093',status:'ACTIVE',spending_limit:'5000.00'},{id:U(32),account_id:U(2),label:'备用卡',last_four:'7742',status:'FROZEN',spending_limit:'2000.00'}]};
DB.bal[U(1)]='12480.50';DB.bal[U(2)]='30000.00';
(function(){var C=['HOUSEHOLD','FOOD','TRANSPORT','ENTERTAINMENT'],M={HOUSEHOLD:'宜家家居',FOOD:'便利蜂',TRANSPORT:'地铁出行',ENTERTAINMENT:'影城'};
 for(var i=0;i<36;i++){var c=C[i%4],d=1+(i*3)%26;DB.tx.push({id:U(100+i),reference:'DEMO-'+String(i+1).padStart(3,'0'),status:'COMPLETED',amount:(20+(i*53)%260)+'.'+String((i*17)%100).padStart(2,'0'),currency:'CNY',description:M[c],category:c,posted_at:'2026-10-'+String(d).padStart(2,'0')+'T04:30:00Z'})}
 DB.tx.sort(function(a,b){return a.posted_at<b.posted_at?1:-1})})();
function er(s,c,m){var e=new Error(m);e.status=s;e.code=c;return e}
function chk(ref,op,type){var a=DB.auth[ref];if(!a||a.used||a.op!==op||a.type!==type||Date.parse(a.exp)<Date.now())throw er(403,'AUTHORIZATION_REQUIRED','invalid authorization');a.used=true}
function grant(ap){var ref=uid(),exp=new Date(Date.now()+600000).toISOString();DB.auth[ref]={op:ap.operation_id,type:ap.operation_type,exp:exp,used:false};ap.status='CONFIRMED';return{authorization_ref:ref,expires_at:exp}}
function spend(){var t=0n,c={},m={};DB.tx.forEach(function(x){if(x.category&&x.posted_at.slice(0,7)==='2026-10'){var a=cents(x.amount);t+=a;c[x.category]=(c[x.category]||0n)+a;m[x.description]=(m[x.description]||0n)+a}});
 var o={total:cs(t),by_category:{},by_merchant:{}};for(var k in c)o.by_category[k]=cs(c[k]);for(var k2 in m)o.by_merchant[k2]=cs(m[k2]);return o}
function mock(M,P,Q,B,H){var m;
 if(M=='GET'&&P=='/accounts')return[200,DB.acc];
 if(m=P.match(/^\/accounts\/([^/]+)\/balance$/)){var a=DB.acc.find(function(x){return x.id==m[1]});if(!a)throw er(404,'NOT_FOUND','not found');return[200,{account_id:a.id,balance:DB.bal[a.id],currency:a.currency}]}
 if(m=P.match(/^\/accounts\/([^/]+)\/transactions$/)){var L=Math.min(200,Math.max(1,+Q.limit||50)),O=Math.max(0,+Q.offset||0);
  var r=DB.tx.filter(function(x){return(!Q.category||x.category==Q.category)&&(!Q.merchant||x.description.toLowerCase().indexOf(Q.merchant.toLowerCase())>-1)&&(!Q.minimum_amount||cents(x.amount)>=cents(Q.minimum_amount))&&(!Q.maximum_amount||cents(x.amount)<=cents(Q.maximum_amount))});
  return[200,{items:r.slice(O,O+L),limit:L,offset:O}]}
 if(M=='GET'&&P=='/beneficiaries')return[200,DB.ben];
 if(M=='GET'&&P=='/beneficiaries/resolve'){var q=(Q.query||'').trim(),f=DB.ben.filter(function(b){return q&&(b.name.indexOf(q)>-1||(b.nickname||'').indexOf(q)>-1)});return[200,{status:f.length?(f.length>1?'AMBIGUOUS':'RESOLVED'):'NOT_FOUND',matches:f}]}
 if(M=='POST'&&P=='/transfers/drafts'){var k=H['Idempotency-Key'];if(!k||k.length>120)throw er(422,'VALIDATION_ERROR','idempotency key required');if(DB.keys[k])return[200,DB.drafts[DB.keys[k]]];
  if(!/^\d{1,16}(\.\d{1,2})?$/.test(B.amount)||cents(B.amount)<=0n||B.source_account_id==B.destination_account_id)throw er(422,'VALIDATION_ERROR','bad request');
  var d={id:uid(),source_account_id:B.source_account_id,destination_account_id:B.destination_account_id,amount:B.amount,currency:B.currency,status:'PENDING_AUTHORIZATION',expires_at:new Date(Date.now()+900000).toISOString(),transaction_id:null};DB.drafts[d.id]=d;DB.keys[k]=d.id;return[201,d]}
 if(m=P.match(/^\/transfers\/(?:drafts\/)?([^/]+)$/)&&M=='GET'){if(!DB.drafts[m[1]])throw er(404,'NOT_FOUND','x');return[200,DB.drafts[m[1]]]}
 if(M=='POST'&&P=='/security/approvals'){var t=B.operation_type,tier='YELLOW',amt=null,cur=null,rid=null,tid=null;
  if(t=='transfer.commit'){var dr=DB.drafts[B.operation_id];if(!dr)throw er(404,'NOT_FOUND','x');amt=dr.amount;cur=dr.currency;tid=dr.source_account_id;rid=dr.destination_account_id;if(DB.out+cents(dr.amount)>100000n)tier='RED'}
  else if(t=='subscription.cancel'){if(!DB.sub.find(function(s){return s.id==B.operation_id}))throw er(404,'NOT_FOUND','x')}
  else if(/^card\.(freeze|unfreeze)$/.test(t)){if(!DB.card.find(function(s){return s.id==B.operation_id}))throw er(404,'NOT_FOUND','x')}else throw er(422,'VALIDATION_ERROR','unsupported');
  var ap={id:uid(),operation_id:B.operation_id,operation_type:t,target_account_id:tid,recipient_id:rid,amount:amt,currency:cur,risk_tier:tier,status:'PENDING',expires_at:new Date(Date.now()+600000).toISOString()};DB.appr[ap.id]=ap;return[201,ap]}
 if(m=P.match(/^\/security\/approvals\/([^/]+)(\/decision|\/mfa)?$/)){var ap2=DB.appr[m[1]];if(!ap2)throw er(404,'NOT_FOUND','x');
  if(!m[2])return[200,ap2];
  if(m[2]=='/decision'){if(ap2.risk_tier=='RED')throw er(403,'AUTHORIZATION_REQUIRED','mfa required');if(!B.accepted){ap2.status='REJECTED';return[200,null]}return[200,grant(ap2)]}
  if(ap2.risk_tier!='RED')throw er(409,'CONFLICT','mfa not needed');var cid=uid();DB.ch[cid]={ap:ap2,fails:0};return[201,{challenge_id:cid,expires_at:new Date(Date.now()+300000).toISOString()}]}
 if(m=P.match(/^\/security\/mfa\/([^/]+)\/verify$/)){var c=DB.ch[m[1]];if(!c)throw er(404,'NOT_FOUND','x');if(c.fails>=3)throw er(403,'FORBIDDEN','safety lock');
  if(B.code!=='123456'){c.fails++;throw er(403,c.fails>=3?'FORBIDDEN':'AUTHORIZATION_REQUIRED','invalid code')}return[200,grant(c.ap)]}
 if(m=P.match(/^\/transfers\/([^/]+)\/commit$/)){var d2=DB.drafts[m[1]];if(!d2)throw er(404,'NOT_FOUND','x');chk(B.authorization_ref,d2.id,'transfer.commit');
  var n=cents(DB.bal[d2.source_account_id]),a2=cents(d2.amount);if(a2>n)throw er(409,'INSUFFICIENT_FUNDS','insufficient funds');DB.bal[d2.source_account_id]=cs(n-a2);DB.out+=a2;
  var tx={id:uid(),reference:'TRF-'+Math.floor(Math.random()*1e6),status:'COMPLETED',amount:d2.amount,currency:d2.currency,description:'转账',category:null,posted_at:new Date().toISOString()};DB.tx.unshift(tx);d2.status='COMPLETED';d2.transaction_id=tx.id;
  return[200,{transaction_id:tx.id,reference:tx.reference,status:'COMPLETED',amount:tx.amount,currency:tx.currency}]}
 if(M=='GET'&&P=='/analytics/spending')return[200,spend()];
 if(M=='GET'&&P=='/budgets')return[200,DB.bud];
 if(M=='POST'&&P=='/budgets'){if(!/^\d{1,16}(\.\d{1,2})?$/.test(B.limit_amount)||!/-01$/.test(B.month))throw er(422,'VALIDATION_ERROR','bad');var b={id:uid(),category:B.category,month:B.month,limit_amount:B.limit_amount,currency:B.currency};DB.bud.push(b);return[201,b]}
 if(m=P.match(/^\/budgets\/([^/]+)\/status$/)){var bu=DB.bud.find(function(x){return x.id==m[1]});if(!bu)throw er(404,'NOT_FOUND','x');var u=cents(spend().by_category[bu.category]||'0'),l=cents(bu.limit_amount);
  return[200,{limit:bu.limit_amount,used:cs(u),remaining:cs(l-u),estimate:cs(u*30n/26n),threshold_exceeded:u*100n>=l*80n}]}
 if(M=='GET'&&P=='/subscriptions')return[200,DB.sub];
 if(m=P.match(/^\/subscriptions\/([^/]+)\/cancel$/)){var s=DB.sub.find(function(x){return x.id==m[1]});if(!s)throw er(404,'NOT_FOUND','x');chk(B.authorization_ref,s.id,'subscription.cancel');s.active=false;s.status='CANCELLED';s.cancelled_at=new Date().toISOString();return[200,s]}
 if(M=='GET'&&P=='/cards')return[200,DB.card];
 if(m=P.match(/^\/cards\/([^/]+)\/(freeze|unfreeze)$/)){var cd=DB.card.find(function(x){return x.id==m[1]});if(!cd)throw er(404,'NOT_FOUND','x');chk(B.authorization_ref,cd.id,'card.'+m[2]);
  if(cd.status=='LOST')throw er(409,'CONFLICT','lost');cd.status=m[2]=='freeze'?'FROZEN':'ACTIVE';return[200,cd]}
 throw er(404,'NOT_FOUND','no route')}

/* ===== 通用 UI ===== */
var NAV=[['home','总览','🏠'],['acc','账户','💳'],['tf','转账','↗'],['bud','预算','📊'],['sub','订阅','🔁'],['card','银行卡','🪪']],cur='home';
$('#nav').innerHTML=NAV.map(function(n){return '<a data-p="'+n[0]+'">'+n[2]+' '+n[1]+'</a>'}).join('');
$('#nav').onclick=function(e){var p=e.target.closest('a');if(p)go(p.dataset.p)};
function go(p){cur=p;document.querySelectorAll('#nav a').forEach(function(a){a.classList.toggle('on',a.dataset.p==p)});pages[p]()}
function main(h){$('#main').innerHTML=h}
async function ld(sel,fn){var el=$(sel);el.innerHTML='<div class="sk">加载中…</div>';try{el.innerHTML=(await fn())||'<div class="empty">暂无数据</div>'}catch(e){el.innerHTML='<div class="errb">'+esc(emsg(e))+'</div>'}}
function modal(h){$('#sh').innerHTML=h;$('#ov').classList.add('on')}function unmodal(){$('#ov').classList.remove('on')}
$('#devb').onclick=function(){$('#dev').classList.toggle('on')};
function chatNote(){modal('<h3>聊天与语音（规划中）</h3><p class="mut">对话接口、语音识别和 LLM/LangGraph 编排尚未接入，当前无法执行指令。聊天发起的转账将复用同一套复核/审批组件。</p><button class="btn p" id="okb">知道了</button>');$('#okb').onclick=unmodal}
$('#mic').onclick=chatNote;$('#cs').onclick=chatNote;$('#ci').onkeydown=function(e){if(e.key=='Enter')chatNote()};

/* 统一审批/MFA 组件：返回 authorization_ref 或 null */
async function authorize(type,opId,rows,title){var ap;try{ap=await api('POST','/security/approvals',{body:{operation_id:opId,operation_type:type}})}catch(e){modal('<div class="errb">'+esc(emsg(e))+'</div><br><button class="btn" id="okb">关闭</button>');$('#okb').onclick=unmodal;return null}
 return new Promise(function(res){var red=ap.risk_tier=='RED',chid=null,msg='',busy=false;
 function done(v){unmodal();res(v)}
 function draw(){modal('<h3>'+esc(title)+' '+pill(ap.risk_tier)+'</h3>'+rows.map(function(r){return '<div class="row"><span class="mut">'+esc(r[0])+'</span><b>'+esc(r[1])+'</b></div>'}).join('')+'<div class="mut" style="margin:8px 0">有效至 '+new Date(ap.expires_at).toLocaleTimeString()+' · 金额或操作变更需重新审批</div>'
  +(red&&chid?'<label>6 位验证码（演示：123456）</label><input class="otp" id="code" maxlength="6" inputmode="numeric">':'')+'<div style="color:var(--r);min-height:22px">'+esc(msg)+'</div>'
  +'<div style="display:flex;gap:8px"><button class="btn" id="no">'+(red&&!chid?'取消':'拒绝')+'</button><button class="'+(red?'btn d':'btn p')+'" id="yes" style="flex:1">'+(red?(chid?'验证并批准':'发送验证码'):'确认')+'</button></div>');
  $('#no').onclick=async function(){try{await api('POST','/security/approvals/'+ap.id+'/decision',{body:{accepted:false}})}catch(e){}done(null)};
  $('#yes').onclick=async function(){if(busy)return;busy=true;$('#yes').disabled=true;
   try{if(!red){done((await api('POST','/security/approvals/'+ap.id+'/decision',{body:{accepted:true}})).authorization_ref)}
    else if(!chid){chid=(await api('POST','/security/approvals/'+ap.id+'/mfa')).challenge_id;msg='';busy=false;draw()}
    else{var v=$('#code').value;done((await api('POST','/security/mfa/'+chid+'/verify',{body:{code:v}})).authorization_ref)}}
   catch(e){msg=emsg(e);busy=false;if(e.code=='FORBIDDEN'){msg='验证失败次数过多，已触发安全锁定';}draw()}}}
 draw()})}

var ACC={sel:null,off:0,F:{}};
pages.acc=async function(){main('<h2>账户与流水</h2><div class="card"><select id="as"></select><div id="ab" style="margin-top:8px"></div></div><div class="card"><div class="f"><div><label>分类</label><select id="fc"><option value="">全部</option>'+Object.keys(CAT).map(function(c){return '<option value="'+c+'">'+CAT[c]+'</option>'}).join('')+'</select></div><div><label>商户</label><input id="fm"></div><div><label>最小金额</label><input id="fa" inputmode="decimal"></div><div><label>最大金额</label><input id="fb" inputmode="decimal"></div><button class="btn p" id="fg">筛选</button></div></div><div class="card"><div id="tl"></div><div style="display:flex;justify-content:space-between;margin-top:10px"><button class="btn" id="pv">上一页</button><button class="btn" id="nx">下一页</button></div></div>');

 ld('#tl',async function(){var q=Object.assign({limit:PG,offset:ACC.off},ACC.F),r=await api('GET','/accounts/'+ACC.sel+'/transactions',{query:q});

var TF={key:null,sig:null,ben:null,accs:[]};
pages.tf=async function(){TF.ben=null;main('<h2>转账</h2><div class="card"><label>付款账户</label><select id="ts"></select><label>收款人（输入姓名或昵称）</label><div style="display:flex;gap:8px"><input id="tq" placeholder="例如：小王"><button class="btn" id="tr">查找</button></div><div id="tm"></div><label>金额（CNY）</label><input id="ta" inputmode="decimal" placeholder="0.00"><div id="te" style="color:var(--r);min-height:22px;margin-top:6px"></div><button class="btn p" id="tg" style="width:100%">提交并复核</button></div><div id="trc"></div>');
 try{TF.accs=await api('GET','/accounts');$('#ts').innerHTML=TF.accs.map(function(x){return '<option value="'+x.id+'">'+esc(x.name)+' · '+esc(x.account_number)+'</option>'}).join('')}catch(e){$('#te').textContent=emsg(e)}
 $('#tr').onclick=async function(){var q=$('#tq').value;try{var r=await api('GET','/beneficiaries/resolve',{query:{query:q}});TF.ben=null;
  if(r.status=='NOT_FOUND'){$('#tm').innerHTML='<div class="empty">未找到收款人</div>';return}
  if(r.status=='RESOLVED')TF.ben=r.matches[0];
  $('#tm').innerHTML=(r.status=='AMBIGUOUS'?'<div class="mut">找到多个匹配，请选择：</div>':'')+r.matches.map(function(b,i){return '<label class="opt'+(TF.ben&&TF.ben.id==b.id?' on':'')+'" data-i="'+i+'">'+esc(b.name)+(b.nickname?'（'+esc(b.nickname)+'）':'')+'</label>'}).join('');
  $('#tm').onclick=function(e){var o=e.target.closest('.opt');if(!o)return;TF.ben=r.matches[+o.dataset.i];document.querySelectorAll('#tm .opt').forEach(function(x){x.classList.toggle('on',x==o)})}}catch(e){$('#tm').innerHTML='<div class="errb">'+esc(emsg(e))+'</div>'}};
 $('#tg').onclick=submitTf};
async function submitTf(){var btn=$('#tg'),err=$('#te');err.textContent='';var amt=$('#ta').value.trim(),src=$('#ts').value;
 if(!TF.ben){err.textContent='请先查找并选择收款人';return}
 if(!/^\d{1,16}(\.\d{1,2})?$/.test(amt)||cents(amt)<=0n){err.textContent='请输入大于 0 的金额，最多两位小数';return}
 amt=cs(cents(amt));var sig=[src,TF.ben.destination_account_id,amt].join('|');if(sig!=TF.sig){TF.sig=sig;TF.key='transfer-'+uid()}
 btn.disabled=true;var d;
 try{d=await api('POST','/transfers/drafts',{headers:{'Idempotency-Key':TF.key},body:{source_account_id:src,destination_account_id:TF.ben.destination_account_id,amount:amt,currency:'CNY'}})}
 catch(e){err.textContent=emsg(e)+(e.code=='NETWORK'?'（重试将沿用同一幂等键）':'');btn.disabled=false;return}
 var ref=await authorize('transfer.commit',d.id,[['收款人',TF.ben.name],['金额',money(d.amount,d.currency)],['付款账户',$('#ts').selectedOptions[0].text]],'确认转账');
 if(!ref){btn.disabled=false;err.textContent='已取消，未转出任何资金';return}
 try{var r=await api('POST','/transfers/'+d.id+'/commit',{body:{authorization_ref:ref}});
  if(r.status!='COMPLETED')throw Object.assign(new Error('pending'),{code:'CONFLICT'});
  $('#trc').innerHTML='<div class="card"><h3>✅ 转账成功 '+pill(r.status)+'</h3><div class="row"><span class="mut">金额</span><b>'+money(r.amount,r.currency)+'</b></div><div class="row"><span class="mut">流水号</span><span>'+esc(r.reference)+'</span></div><div class="row"><span class="mut">交易 ID</span><span class="mut">'+esc(r.transaction_id)+'</span></div></div>';TF.sig=null}
 catch(e){err.innerHTML=esc(emsg(e))+(e.code=='NETWORK'?' <button class="btn" id="qs">查询转账状态</button>':'');var q=$('#qs');if(q)q.onclick=async function(){try{var s=await api('GET','/transfers/'+d.id);err.textContent='当前状态：'+(ST[s.status]||s.status)}catch(x){err.textContent=emsg(x)}}}
 btn.disabled=false}
